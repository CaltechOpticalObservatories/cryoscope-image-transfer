# /etc/cryoscope/site.conf
#
# The single address table for Cryoscope image transfer.
# Identical on every machine. No address appears anywhere else: not in a
# script, not in a unit file, not in the nginx configuration.
#
# Changing the network is one edit to this file, followed by re-running
# setup.sh on each machine.
#
CRYOCONTROL_IP=131.215.110.240
CONCORDIA1_IP=131.215.110.239
CONCORDIA2_IP=131.215.110.238

# Eavesdroppers: every machine permitted to fetch images over HTTP_PORT.
# Space-separated addresses, in any order, any number of them. Empty means no
# machine outside the three above may fetch.
#
# Add a machine by adding its address here and re-running setup.sh on every
# machine. Remove one the same way. Nothing else in the system needs editing,
# and no eavesdropper is named anywhere else.
#
EAVESDROPPERS=""

# Wire protocol constants. These are the third-party contract in DDD 19.4.
# Changing them costs a negotiation, not an edit.
#
MCAST_GROUP=239.192.1.1
MCAST_PORT=5555
HTTP_PORT=8080

# Paths.
#
IMAGE_DIR=/images
INCOMING_DIR=/data/incoming
MANIFEST_DIR=/data/manifests
LOCK_DIR=/var/lock/pull-images

# The hash manifest on cryocontrol. Outside IMAGE_DIR, so the transfer never
# copies it.
ACQ_MANIFEST=/var/lib/cryoscope/acq.manifest

# Retention on cryocontrol (reaper.sh). An image is deleted only when a
# concordia's hash of its copy matches the hash in ACQ_MANIFEST, and only when
# IMAGE_DIR's disk is at least REAP_START_PCT used; deletion is oldest first,
# never an image newer than REAP_MIN_AGE_HOURS or among the newest
# REAP_KEEP_NEWEST, and stops at REAP_STOP_PCT used. Nothing younger than
# REAP_MIN_AGE_HOURS can be freed, so a day's data must fit between
# REAP_START_PCT and full.
#
# REAP_DRY_RUN=1 lists what would be deleted in would-delete.txt beside
# ACQ_MANIFEST and deletes nothing. Set it to 0 to delete. Every change here
# takes effect by re-running setup.sh.
#
REAP_DRY_RUN=1
REAP_START_PCT=75
REAP_STOP_PCT=60
REAP_MIN_AGE_HOURS=24
REAP_KEEP_NEWEST=1000
